<style>
:root{
  --emerald:#0B6E4F; --emerald-dark:#063D2C; --emerald-soft:#E7F2ED;
  --gold:#C89B3C; --gold-soft:#F6ECD6; --cream:#FAF7EF; --card:#FFFFFF;
  --ink:#1E2A28; --slate:#65756F; --line:#E4DFD2;
  --danger:#B3392C; --danger-soft:#FBECE9; --warn:#B4791E; --warn-soft:#FDF1DF;
  --ok:#2E7D4F; --ok-soft:#E9F5EC; --radius:12px;
  --font-head:Georgia,'Palatino Linotype','Times New Roman',serif;
  --font-body:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);font-size:14.5px}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--emerald-dark);margin:0 0 6px 0;font-weight:600}
button{font-family:var(--font-body);cursor:pointer}
a{color:var(--emerald)}
input,select,textarea{font-family:var(--font-body);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:disabled{background:#F3F1EA;color:var(--slate)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
label{font-size:12.5px;color:var(--slate);display:block;margin-bottom:4px;font-weight:600}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:160px}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .05s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--emerald);color:#fff}
.btn-primary:hover{background:var(--emerald-dark)}
.btn-gold{background:var(--gold);color:#3a2c07}
.btn-outline{background:#fff;color:var(--emerald);border:1.5px solid var(--emerald)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-ghost{background:transparent;color:var(--slate)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,40,30,.04)}
.pattern-strip{height:6px;background:repeating-linear-gradient(135deg,var(--gold) 0 10px,var(--emerald) 10px 20px);border-radius:3px;margin-bottom:14px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--emerald-dark);font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--emerald-soft)}
tr:hover td{background:#FBFAF5}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}

.attn-btns{display:flex;gap:4px}

.attn-btns button.sel-H{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.attn-btns button.sel-A{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}

.modal{background:#fff;border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto}

@media print{ #sidebar,#topbar,.no-print{display:none!important} #content{padding:0;max-width:100%} body{background:#fff} }
@media (max-width:880px){ #app{flex-direction:column} #sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px} .brand{display:none} .nav-sep{display:none} .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent} #content{padding:16px} }
</style>

const CONFIG_MISSING = SUPABASE_URL.includes('PASTE_') || SUPABASE_ANON_KEY.includes('PASTE_');

const state = { user:null, page:'dashboard', sub:{} };
let DB = { guru:[], mapel:[], kelas:[], tahunPelajaran:[], settings:{tahunAktif:'',semesterAktif:'Ganjil',bobot:{uh:40,sts:30,sas:30}},
  siswa:[], jurnal:[], kehadiran:[], nilai:[], catatanWali:[], locks:[], profiles:[], auditLog:[] };
const semesterList = ['Ganjil','Genap'];
const JENIS_NILAI = ['Formatif 1','Formatif 2','Formatif 3','Formatif 4','Formatif 5','ASTS 1','ASTS 2','ASAS 1','ASAS 2','Praktik Ibadah'];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function hariDariTanggal(t){ const d=new Date(t+'T00:00:00'); return ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()]; }
function fmtTgl(t){ if(!t) return '-'; const d=new Date(t+'T00:00:00'); const b=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return d.getDate()+' '+b[d.getMonth()]+' '+d.getFullYear(); }
function toast(msg,type){ const el=document.createElement('div'); el.className='toast'+(type==='err'?' err':''); el.textContent=msg; document.getElementById('toastWrap').appendChild(el); setTimeout(()=>el.remove(),3400); }
function siswaById(id){ return DB.siswa.find(s=>s.id===id); }
function siswaByKelas(k){ return DB.siswa.filter(s=>s.kelas===k); }
function isWali(){ return state.user.role==='wali'; }
function myKelas(){ return state.user.wali_kelas_of; }
function labelRole(r){ return r==='admin'?'Administrator':r==='guru'?'Guru':'Wali Kelas'; }

async function logAudit(aksi, detail){
  try{ await sb.from('audit_log').insert({user_nama: state.user?state.user.nama:'-', aksi, detail}); }catch(e){}
}

/* ---------------- AUTH ---------------- */
async function doLogin(email, password){
  if(CONFIG_MISSING) return;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ toast('Login gagal: '+error.message, 'err'); return; }
  const { data: profile, error: perr } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if(perr || !profile){ toast('Akun ditemukan tapi profil belum lengkap. Hubungi Administrator.', 'err'); await sb.auth.signOut(); return; }
  state.user = { id: data.user.id, email: data.user.email, nama: profile.nama, role: profile.role, wali_kelas_of: profile.wali_kelas_of };
  await fetchAll();
  state.page='dashboard'; render();
}
async function doLogout(){ await sb.auth.signOut(); state.user=null; render(); }

/* ---------------- FETCH DATA (RLS otomatis membatasi hasil sesuai peran) ---------------- */
async function fetchAll(){
  const [guruR, mapelR, kelasR, tahunR, pengR, siswaR, locksR] = await Promise.all([
    sb.from('guru').select('*').order('nama'),
    sb.from('mapel').select('*').order('nama'),
    sb.from('kelas').select('*').order('nama'),
    sb.from('tahun_pelajaran').select('*').order('nama'),
    sb.from('pengaturan').select('*').eq('id',1).single(),
    sb.from('siswa').select('*').order('nama'),
    sb.from('locks').select('*')
  ]);
  DB.guru = guruR.data||[];
  DB.mapel = (mapelR.data||[]).map(r=>r.nama);
  DB.kelas = (kelasR.data||[]).map(r=>r.nama);
  DB.tahunPelajaran = (tahunR.data||[]).map(r=>r.nama);
  DB.siswa = siswaR.data||[];
  DB.locks = (locksR.data||[]).map(r=>r.kunci);
  const p = pengR.data||{};
  DB.settings = { tahunAktif:p.tahun_aktif||DB.tahunPelajaran[0]||'', semesterAktif:p.semester_aktif||'Ganjil', bobot:{uh:p.bobot_uh??40, sts:p.bobot_sts??30, sas:p.bobot_sas??30} };
  await Promise.all([fetchJurnal(), fetchKehadiran(), fetchNilai(), fetchCatatanWali()]);
  if(state.user.role==='admin'){ await fetchProfiles(); await fetchAudit(); }
}
async function fetchJurnal(){ const {data} = await sb.from('jurnal').select('*').order('tanggal',{ascending:false}); DB.jurnal = data||[]; }
async function fetchKehadiran(){
  const {data:heads} = await sb.from('kehadiran').select('*').order('tanggal',{ascending:false});
  const ids = (heads||[]).map(h=>h.id);
  let details=[];
  if(ids.length){ const {data} = await sb.from('kehadiran_detail').select('*').in('kehadiran_id', ids); details = data||[]; }
  DB.kehadiran = (heads||[]).map(h=>({ id:h.id, kelas:h.kelas, mapel:h.mapel, tanggal:h.tanggal,
    records: details.filter(d=>d.kehadiran_id===h.id).map(d=>({siswaId:d.siswa_id, status:d.status})) }));
}
async function fetchNilai(){ const {data} = await sb.from('nilai').select('*'); DB.nilai = data||[]; }
async function fetchCatatanWali(){ const {data} = await sb.from('catatan_wali').select('*'); DB.catatanWali = data||[]; }
async function fetchProfiles(){ const {data} = await sb.from('profiles').select('*').order('nama'); DB.profiles = data||[]; }
async function fetchAudit(){ const {data} = await sb.from('audit_log').select('*').order('waktu',{ascending:false}).limit(200); DB.auditLog = data||[]; }

/* ---------------- STORAGE: FOTO JURNAL ---------------- */
function compressImage(file){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=(e)=>{ img.onload=()=>{
      const maxW=480; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(b=>resolve(b),'image/jpeg',0.6);
    }; img.src=e.target.result; };
    reader.readAsDataURL(file);
  });
}
async function uploadFoto(file){
  const blob = await compressImage(file);
  const path = `${state.user.id}/${uid()}.jpg`;
  const { error } = await sb.storage.from('jurnal-foto').upload(path, blob, {contentType:'image/jpeg'});
  if(error){ toast('Gagal mengunggah foto: '+error.message,'err'); return null; }
  return path;
}
async function signedUrl(path){
  if(!path) return null;
  const { data } = await sb.storage.from('jurnal-foto').createSignedUrl(path, 3600);
  return data ? data.signedUrl : null;
}

/* ---------------- NAV ---------------- */
function navFor(role){
  const common=[{k:'dashboard',i:'🏠',l:'Dashboard'}];
  if(role==='admin') return [...common,
    {sep:'Kegiatan Belajar'},{k:'jurnal',i:'👨‍🏫',l:'Jurnal Mengajar'},{k:'kehadiran',i:'👥',l:'Kehadiran'},
    {k:'penilaian',i:'📊',l:'Penilaian'},{k:'dbnilai',i:'📚',l:'Database Nilai'},{k:'raport',i:'📄',l:'Raport Digital'},
    {sep:'Data Induk'},{k:'siswa',i:'👨‍🎓',l:'Data Siswa'},{k:'guru',i:'👩‍🏫',l:'Data Guru'},{k:'mapel',i:'📖',l:'Mata Pelajaran'},
    {k:'kelas',i:'🏫',l:'Kelas'},{k:'periode',i:'🗓️',l:'Tahun & Semester'},
    {sep:'Administrasi'},{k:'bobot',i:'⚖️',l:'Bobot Nilai'},{k:'akun',i:'🔑',l:'Kelola Akun'},{k:'laporan',i:'📈',l:'Export / Import'},
    {k:'audit',i:'🗂️',l:'Audit Log'},{sep:' '},{k:'logout',i:'🚪',l:'Logout'}];
  if(role==='guru') return [...common,{k:'jurnal',i:'👨‍🏫',l:'Jurnal Mengajar'},{k:'kehadiran',i:'👥',l:'Kehadiran'},{k:'penilaian',i:'📊',l:'Penilaian'},{k:'logout',i:'🚪',l:'Logout'}];
  return [...common,{k:'siswa',i:'👨‍🎓',l:'Siswa Kelas Saya'},{k:'kehadiran',i:'👥',l:'Rekap Kehadiran'},{k:'dbnilai',i:'📚',l:'Nilai Kelas Saya'},
    {k:'catatanwali',i:'📝',l:'Catatan Wali Kelas'},{k:'raport',i:'📄',l:'Raport Digital'},{k:'logout',i:'🚪',l:'Logout'}];
}
function pageTitle(){
  const map={dashboard:'Dashboard',jurnal:'Jurnal Mengajar',kehadiran:'Kehadiran Siswa',penilaian:'Penilaian Siswa',dbnilai:'Database Nilai',
  raport:'Raport Digital',siswa:'Data Siswa',guru:'Data Guru',mapel:'Mata Pelajaran',kelas:'Data Kelas',periode:'Tahun Pelajaran & Semester',
  bobot:'Pengaturan Bobot Nilai',akun:'Kelola Akun Pengguna',laporan:'Export & Import Data',audit:'Audit Log',catatanwali:'Catatan Wali Kelas'};
  return map[state.page]||'';
}

/* ---------------- RENDER SHELL ---------------- */
function render(){
  const app=document.getElementById('app');
  if(CONFIG_MISSING){
    app.innerHTML = `<div class="login-wrap"><div class="config-warn">
      <b>⚠ Aplikasi belum terhubung ke database.</b><br><br>
      Admin perlu mengisi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas file <code>index.html</code> sebelum aplikasi ini bisa dipakai.
      Lihat "Panduan Deploy Supabase & Vercel" untuk langkahnya.
    </div></div>`;
    return;
  }
  if(!state.user){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  const nav = navFor(state.user.role);
  app.innerHTML = `
    <div id="sidebar">
      <div class="brand"><div class="crest">M</div><h1>MIICA Digital<br>Academic System</h1><p>Jurnal • Penilaian • Raport Digital</p></div>
      ${nav.map(n=> n.sep? `<div class="nav-sep">${n.sep}</div>` : `<div class="nav-item ${state.page===n.k?'active':''}" data-nav="${n.k}">${n.i} <span>${n.l}</span></div>`).join('')}
    </div>
    <div id="main">
      <div id="topbar" class="no-print">
        <h2 style="font-size:18px">${pageTitle()}</h2>
        <div class="userchip">
          <span class="badge badge-ok">🔒 Tersambung ke Supabase</span>
          <span class="avatar">${state.user.nama.charAt(0).toUpperCase()}</span>
          <div><b>${state.user.nama}</b><br><span style="color:var(--slate);font-size:11.5px">${labelRole(state.user.role)}</span></div>
        </div>
      </div>
      <div id="content"></div>
    </div>`;
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{
    const k=el.getAttribute('data-nav'); if(k==='logout'){ doLogout(); return; } state.page=k; state.sub={}; render();
  }));
  renderContent();
}
function renderContent(){
  const map={dashboard:pageDashboard,jurnal:pageJurnal,kehadiran:pageKehadiran,penilaian:pagePenilaian,dbnilai:pageDbNilai,raport:pageRaport,
    siswa:pageSiswa,guru:pageGuru,mapel:pageMapel,kelas:pageKelas,periode:pagePeriode,bobot:pageBobot,akun:pageAkun,laporan:pageLaporan,
    audit:pageAudit,catatanwali:pageCatatanWali};
  document.getElementById('content').innerHTML = (map[state.page]||pageDashboard)();
  bindPageEvents();
}

function renderLogin(){
  return `<div class="login-wrap"><div class="login-card">
    <div class="login-crest">M</div>
    <h1>MIICA Digital Academic System</h1>
    <p class="sub">Jurnal Mengajar, Penilaian, dan Raport Digital</p>
    <div class="field"><label>Email</label><input id="loginEmail" placeholder="nama@sekolah.sch.id"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="btnLogin" style="width:100%;justify-content:center;padding:11px">Masuk</button>
    <div class="hint-box">Belum punya akun? Hubungi Administrator sekolah. Akun dibuat oleh Administrator melalui Supabase Dashboard.</div>
  </div></div>`;
}
function attachLoginEvents(){
  document.getElementById('btnLogin').addEventListener('click', ()=>doLogin(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPass').value));
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
}

/* ================= DASHBOARD ================= */
function pageDashboard(){
  if(state.user.role!=='admin'){
    const nama=state.user.nama;
    const jurnalSaya = DB.jurnal.filter(j=>j.guru_nama===nama).length;
    const nilaiSaya = DB.nilai.filter(n=>n.guru_nama===nama).length;
    return `<div class="pattern-strip"></div>

  let tally={H:0,S:0,I:0,A:0}; DB.kehadiran.forEach(k=>k.records.forEach(r=>tally[r.status]++));

  const pct = totalTally? Math.round(tally.H/totalTally*100)+'%':'-';
  const guruSudah=new Set(DB.nilai.map(n=>n.guru_nama));
  const guruBelum=DB.guru.filter(g=>!guruSudah.has(g.nama));
  return `<div class="pattern-strip"></div>

/* ================= DATABASE NILAI (REKAP) ================= */
function hitungNilaiAkhir(uhList, sts, sas){
  const b=DB.settings.bobot; const avgUH = uhList.length? uhList.reduce((a,b)=>a+b,0)/uhList.length : 0;
  return (avgUH*b.uh + (sts||0)*b.sts + (sas||0)*b.sas)/100;
}
function predikat(v){ if(v>=90) return 'A (Sangat Baik)'; if(v>=80) return 'B (Baik)'; if(v>=70) return 'C (Cukup)'; return 'D (Perlu Bimbingan)'; }
function deskripsiCapaian(nama,mapel,v){
  if(v>=90) return `Ananda ${nama} menunjukkan penguasaan sangat baik pada mata pelajaran ${mapel}.`;
  if(v>=80) return `Ananda ${nama} menunjukkan penguasaan baik pada mata pelajaran ${mapel}.`;
  if(v>=70) return `Ananda ${nama} cukup menguasai mata pelajaran ${mapel}, perlu latihan lebih lanjut.`;
  return `Ananda ${nama} memerlukan bimbingan lebih lanjut pada mata pelajaran ${mapel}.`;
}

/* =====================================================================
   EVENT BINDING
   ===================================================================== */
function bindPageEvents(){
  const $=(id)=>document.getElementById(id);
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };
  const onAll=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));

  on('btnAddGuru','click', async ()=>{
    const v=$('newGuruNama').value.trim(); if(!v) return toast('Nama tidak boleh kosong','err');
    const {data,error}=await sb.from('guru').insert({nama:v}).select().single();
    if(error) return toast('Gagal: '+error.message,'err');
    DB.guru.push(data); logAudit('Tambah Guru',v); toast('Guru ditambahkan'); renderContent();
  });
  onAll('[data-del-guru]','click', async (e)=>{
    const id=e.target.getAttribute('data-del-guru');
    const {error}=await sb.from('guru').delete().eq('id',id);
    if(error) return toast('Gagal hapus: '+error.message,'err');
    DB.guru=DB.guru.filter(g=>g.id!==id); logAudit('Hapus Guru',id); toast('Guru dihapus'); renderContent();
  });

  on('btnAddMapel','click', async ()=>{
    const v=$('newMapel').value.trim(); if(!v) return toast('Nama tidak boleh kosong','err');
    const {error}=await sb.from('mapel').insert({nama:v});
    if(error) return toast('Gagal (mungkin sudah ada): '+error.message,'err');
    DB.mapel.push(v); toast('Mapel ditambahkan'); renderContent();
  });
  onAll('[data-del-mapel]','click', async (e)=>{
    const v=e.target.getAttribute('data-del-mapel');
    await sb.from('mapel').delete().eq('nama',v);
    DB.mapel=DB.mapel.filter(m=>m!==v); toast('Mapel dihapus'); renderContent();
  });

  on('btnAddKelas','click', async ()=>{
    const v=$('newKelas').value.trim(); if(!v) return toast('Nama kelas tidak boleh kosong','err');
    const {error}=await sb.from('kelas').insert({nama:v});
    if(error) return toast('Gagal (mungkin sudah ada): '+error.message,'err');
    DB.kelas.push(v); toast('Kelas ditambahkan'); renderContent();
  });
  onAll('[data-del-kelas]','click', async (e)=>{
    const v=e.target.getAttribute('data-del-kelas');
    await sb.from('kelas').delete().eq('nama',v);
    DB.kelas=DB.kelas.filter(k=>k!==v); toast('Kelas dihapus'); renderContent();
  });

  on('btnAddTahun','click', async ()=>{
    const v=$('newTahun').value.trim(); if(!v) return toast('Isi tahun pelajaran','err');
    const {error}=await sb.from('tahun_pelajaran').insert({nama:v});
    if(error) return toast('Gagal: '+error.message,'err');
    DB.tahunPelajaran.push(v); toast('Tahun ditambahkan'); renderContent();
  });
  onAll('[data-set-tahun]','click', async (e)=>{
    DB.settings.tahunAktif=e.target.getAttribute('data-set-tahun');
    await sb.from('pengaturan').update({tahun_aktif:DB.settings.tahunAktif}).eq('id',1); renderContent();
  });
  onAll('[data-set-semester]','click', async (e)=>{
    DB.settings.semesterAktif=e.target.getAttribute('data-set-semester');
    await sb.from('pengaturan').update({semester_aktif:DB.settings.semesterAktif}).eq('id',1); renderContent();
  });

  on('btnNewSiswa','click', ()=>{ document.body.insertAdjacentHTML('beforeend', siswaFormModal(null)); bindSiswaModal(); });
  onAll('[data-edit-siswa]','click', (e)=>{ document.body.insertAdjacentHTML('beforeend', siswaFormModal(siswaById(e.target.getAttribute('data-edit-siswa')))); bindSiswaModal(); });
  onAll('[data-del-siswa]','click', async (e)=>{
    if(!confirm('Hapus data siswa ini?')) return;
    const id=e.target.getAttribute('data-del-siswa');
    const {error}=await sb.from('siswa').delete().eq('id',id);
    if(error) return toast('Gagal hapus: '+error.message,'err');
    DB.siswa=DB.siswa.filter(s=>s.id!==id); logAudit('Hapus Siswa',id); toast('Siswa dihapus'); renderContent();
  });
  on('btnExportSiswa','click', ()=>{
    const ws=XLSX.utils.json_to_sheet(DB.siswa.map(s=>({NIS:s.nis,NISN:s.nisn,Nama:s.nama,JK:s.jk,Kelas:s.kelas,TempatLahir:s.tempat_lahir,TglLahir:s.tgl_lahir,Ortu:s.ortu,Kontak:s.kontak,Alamat:s.alamat})));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Siswa'); XLSX.writeFile(wb,'data_siswa.xlsx');
  });
  on('btnImportSiswa','click', ()=>$('fileImportSiswa').click());
  on('fileImportSiswa','change', (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=async (ev)=>{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const payload = rows.map(r=>({nis:r.NIS||r.Nis||'',nisn:r.NISN||'',nama:r.Nama||r.nama||'',jk:r.JK||'',kelas:r.Kelas||DB.kelas[0]||'',tempat_lahir:r.TempatLahir||'',tgl_lahir:r.TglLahir||null,ortu:r.Ortu||'',kontak:r.Kontak||'',alamat:r.Alamat||''}));
      const {data,error}=await sb.from('siswa').insert(payload).select();
      if(error) return toast('Gagal impor: '+error.message,'err');
      DB.siswa.push(...(data||[])); logAudit('Import Siswa', rows.length+' baris'); toast(rows.length+' siswa berhasil diimpor'); renderContent();
    };
    reader.readAsArrayBuffer(f);
  });

  on('btnNewJurnal','click', ()=>{ document.body.insertAdjacentHTML('beforeend', jurnalFormModal()); bindJurnalModal(); });
  onAll('[data-view-jurnal]','click', (e)=>{ jurnalViewModal(DB.jurnal.find(x=>x.id===e.target.getAttribute('data-view-jurnal'))); });
  onAll('[data-del-jurnal]','click', async (e)=>{
    if(!confirm('Hapus jurnal ini?')) return;
    const id=e.target.getAttribute('data-del-jurnal');
    const {error}=await sb.from('jurnal').delete().eq('id',id);
    if(error) return toast('Gagal hapus: '+error.message,'err');
    DB.jurnal=DB.jurnal.filter(j=>j.id!==id); toast('Jurnal dihapus'); renderContent();
  });

  on('btnLoadKehadiran','click', ()=>{ state.sub.khKelas=$('khKelas').value; state.sub.khMapel=$('khMapel').value; state.sub.khTanggal=$('khTanggal').value; state.sub.khShow=true; renderContent(); });
  on('btnLoadRekap','click', ()=>{ state.sub.khKelas=$('khKelas').value; renderContent(); });
  onAll('.attn-btns button','click', (e)=>{ const wrap=e.target.closest('.attn-btns'); wrap.querySelectorAll('button').forEach(b=>b.className=''); e.target.className='sel-'+e.target.getAttribute('data-attn'); });
  on('btnSaveKehadiran','click', async ()=>{
    const kelas=state.sub.khKelas, mapel=state.sub.khMapel, tanggal=state.sub.khTanggal;
    const {data:head,error:e1}=await sb.from('kehadiran').upsert({kelas,mapel,tanggal,guru_id:state.user.id},{onConflict:'kelas,mapel,tanggal'}).select().single();
    if(e1) return toast('Gagal simpan: '+e1.message,'err');
    await sb.from('kehadiran_detail').delete().eq('kehadiran_id',head.id);
    const rows=[]; document.querySelectorAll('.attn-btns').forEach(w=>{
      const sel=w.querySelector('button[class^="sel-"]');
      rows.push({kehadiran_id:head.id, siswa_id:w.getAttribute('data-siswa'), status: sel? sel.getAttribute('data-attn') : 'H'});
    });
    if(rows.length){ const {error:e2}=await sb.from('kehadiran_detail').insert(rows); if(e2) return toast('Gagal simpan detail: '+e2.message,'err'); }
    await fetchKehadiran(); logAudit('Simpan Kehadiran', `${kelas}/${mapel}/${tanggal}`); toast('Kehadiran berhasil disimpan'); renderContent();
  });

  on('btnLoadNilai','click', ()=>{ Object.assign(state.sub,{pnTahun:$('pnTahun').value,pnSemester:$('pnSemester').value,pnKelas:$('pnKelas').value,pnMapel:$('pnMapel').value,pnJenis:$('pnJenis').value,pnShow:true}); renderContent(); });
  on('btnToggleLock','click', async (e)=>{
    const key=e.target.getAttribute('data-key');
    if(DB.locks.includes(key)){ await sb.from('locks').delete().eq('kunci',key); DB.locks=DB.locks.filter(k=>k!==key); toast('Kunci dibuka'); }
    else { await sb.from('locks').insert({kunci:key}); DB.locks.push(key); toast('Nilai dikunci'); }
    renderContent();
  });
  on('btnSaveNilai','click', async ()=>{
    const {pnTahun:tahun,pnSemester:semester,pnKelas:kelas,pnMapel:mapel,pnJenis:jenis}=state.sub;
    const rows=[];
    document.querySelectorAll('[data-nilai-input]').forEach(inp=>{
      const siswa_id=inp.getAttribute('data-nilai-input'); if(inp.value==='') return;
      const catatan=document.querySelector(`[data-nilai-catatan="${siswa_id}"]`).value;
      rows.push({tahun_pelajaran:tahun,semester,kelas,mapel,jenis,siswa_id,nilai:Number(inp.value),catatan,guru_id:state.user.id,guru_nama:state.user.nama,tanggal:todayISO(),updated_at:new Date().toISOString()});
    });
    if(!rows.length) return toast('Tidak ada nilai untuk disimpan','err');
    const {error}=await sb.from('nilai').upsert(rows,{onConflict:'tahun_pelajaran,semester,kelas,mapel,jenis,siswa_id'});
    if(error) return toast('Gagal simpan (mungkin nilai sedang dikunci): '+error.message,'err');
    await fetchNilai(); logAudit('Simpan Nilai', `${kelas}/${mapel}/${jenis}`); toast('Nilai berhasil disimpan'); renderContent();
  });

  on('btnLoadRekapNilai','click', ()=>{ Object.assign(state.sub,{rkTahun:$('rkTahun').value,rkSemester:$('rkSemester').value,rkKelas:$('rkKelas').value,rkMapel:$('rkMapel').value,rkShow:true}); renderContent(); });
  on('btnPrintRekap','click', ()=>window.print());
  on('btnExportRekap','click', ()=>{
    const list=siswaByKelas(state.sub.rkKelas);
    const rows=list.map(sw=>{
      const get=(j)=>{const f=DB.nilai.find(n=>n.tahun_pelajaran===state.sub.rkTahun&&n.semester===state.sub.rkSemester&&n.kelas===state.sub.rkKelas&&n.mapel===state.sub.rkMapel&&n.jenis===j&&n.siswa_id===sw.id); return f?f.nilai:'';};
      const uh=[1,2,3,4,5].map(n=>get('UH '+n));
      return {Nama:sw.nama,UH1:uh[0],UH2:uh[1],UH3:uh[2],UH4:uh[3],UH5:uh[4],STS:get('STS'),SAS:get('SAS')};
    });
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Rekap'); XLSX.writeFile(wb,'rekap_nilai.xlsx');
  });

  on('btnSaveBobot','click', async ()=>{
    const uh=Number($('bUh').value), sts=Number($('bSts').value), sas=Number($('bSas').value);
    if(uh+sts+sas!==100) return toast('Total bobot harus 100%','err');
    const {error}=await sb.from('pengaturan').update({bobot_uh:uh,bobot_sts:sts,bobot_sas:sas}).eq('id',1);
    if(error) return toast('Gagal: '+error.message,'err');
    DB.settings.bobot={uh,sts,sas}; logAudit('Ubah Bobot Nilai',`${uh}/${sts}/${sas}`); toast('Bobot nilai disimpan'); renderContent();
  });

  on('btnLihatRaport','click', ()=>{ Object.assign(state.sub,{rpTahun:$('rpTahun').value,rpSemester:$('rpSemester').value,rpKelas:$('rpKelas').value,rpSiswa:$('rpSiswa').value,rpShow:true}); renderContent(); });
  on('btnPrintRaport','click', ()=>window.print());

  onAll('[data-save-catatan]','click', async (e)=>{
    const siswa_id=e.target.getAttribute('data-save-catatan');
    const isi=document.querySelector(`[data-catatan-siswa="${siswa_id}"]`).value;
    const tahun_pelajaran=$('cwTahun').value, semester=$('cwSemester').value, kelas=myKelas();
    const {error}=await sb.from('catatan_wali').upsert({siswa_id,kelas,tahun_pelajaran,semester,isi,updated_at:new Date().toISOString()},{onConflict:'siswa_id,kelas,tahun_pelajaran,semester'});
    if(error) return toast('Gagal simpan: '+error.message,'err');
    await fetchCatatanWali(); toast('Catatan disimpan');
  });

  onAll('[data-save-profile]','click', async (e)=>{
    const id=e.target.getAttribute('data-save-profile');
    const nama=document.querySelector(`[data-profile-nama="${id}"]`).value;
    const role=document.querySelector(`[data-profile-role="${id}"]`).value;
    const wali_kelas_of=document.querySelector(`[data-profile-kelas="${id}"]`).value||null;
    const {error}=await sb.from('profiles').update({nama,role,wali_kelas_of}).eq('id',id);
    if(error) return toast('Gagal: '+error.message,'err');
    logAudit('Ubah Profil Akun', nama+' -> '+role); toast('Profil disimpan'); await fetchProfiles(); renderContent();
  });

  on('expSiswaXlsx','click', ()=>$('btnExportSiswa')?.click());
  on('expKehadiranXlsx','click', ()=>{
    const rows=[]; DB.kehadiran.forEach(k=>k.records.forEach(r=>{ const sw=siswaById(r.siswaId); rows.push({Tanggal:k.tanggal,Kelas:k.kelas,Mapel:k.mapel,Nama:sw?sw.nama:r.siswaId,Status:r.status}); }));
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Kehadiran'); XLSX.writeFile(wb,'data_kehadiran.xlsx');
  });
  on('expNilaiXlsx','click', ()=>{
    const rows=DB.nilai.map(n=>{ const sw=siswaById(n.siswa_id); return {Nama:sw?sw.nama:n.siswa_id,Kelas:n.kelas,Mapel:n.mapel,Jenis:n.jenis,Nilai:n.nilai,TahunPelajaran:n.tahun_pelajaran,Semester:n.semester,Guru:n.guru_nama}; });
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Nilai'); XLSX.writeFile(wb,'data_nilai.xlsx');
  });
  on('fileImportNilai','change', (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=async (ev)=>{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const payload=[];
      rows.forEach(r=>{ const sw=DB.siswa.find(s=>s.nis===String(r.NIS)); if(!sw) return;
        payload.push({tahun_pelajaran:r.TahunPelajaran||DB.settings.tahunAktif, semester:r.Semester||DB.settings.semesterAktif, kelas:r.Kelas||sw.kelas, mapel:r.Mapel, jenis:r.Jenis, siswa_id:sw.id, nilai:Number(r.Nilai), catatan:'', guru_id:state.user.id, guru_nama:state.user.nama, tanggal:todayISO()});
      });
      if(!payload.length) return toast('Tidak ada baris valid (periksa kolom NIS)','err');
      const {error}=await sb.from('nilai').upsert(payload,{onConflict:'tahun_pelajaran,semester,kelas,mapel,jenis,siswa_id'});
      if(error) return toast('Gagal impor: '+error.message,'err');
      await fetchNilai(); logAudit('Import Nilai', payload.length+' baris'); toast(payload.length+' data nilai diimpor'); renderContent();
    };
    reader.readAsArrayBuffer(f);
  });
}

function bindSiswaModal(){
  const $=(id)=>document.getElementById(id);
  $('btnCancelSiswa').addEventListener('click', ()=>$('siswaModalBg').remove());
  $('btnSaveSiswa').addEventListener('click', async (e)=>{
    const id=e.target.getAttribute('data-id');
    const nama=$('fNama').value.trim(); if(!nama) return toast('Nama wajib diisi','err');
    const data={nis:$('fNis').value,nisn:$('fNisn').value,nama,jk:$('fJk').value,kelas:$('fKelas').value,tempat_lahir:$('fTempat').value,tgl_lahir:$('fTgllahir').value||null,ortu:$('fOrtu').value,kontak:$('fKontak').value,alamat:$('fAlamat').value};
    if(id){
      const {error}=await sb.from('siswa').update(data).eq('id',id);
      if(error) return toast('Gagal: '+error.message,'err');
      Object.assign(siswaById(id), data); logAudit('Edit Siswa', nama);
    } else {
      const {data:row,error}=await sb.from('siswa').insert(data).select().single();
      if(error) return toast('Gagal: '+error.message,'err');
      DB.siswa.push(row); logAudit('Tambah Siswa', nama);
    }
    toast('Data siswa disimpan'); $('siswaModalBg').remove(); renderContent();
  });
}

function bindJurnalModal(){
  const $=(id)=>document.getElementById(id);
  let foto1File=null;
$('jFoto1').addEventListener('change', (e)=>{ foto1File=e.target.files[0]||null; updatePrev(); });
function updatePrev(){
  $('jPreviewRow').innerHTML = (foto1File? `<img class="photo-thumb" src="${URL.createObjectURL(foto1File)}">`:'');
}
  }
  $('btnCancelJurnal').addEventListener('click', ()=>$('jurnalModalBg').remove());
  async function collectAndSave(status, requirePhotos){
    if(!$('jMateri').value.trim()) return toast('Materi pembelajaran wajib diisi','err');
   if(requirePhotos && !foto1File) return toast('Foto kegiatan wajib diunggah','err');
    const btns=['btnSaveDraftJurnal','btnKirimJurnal']; btns.forEach(b=>{ if($(b)) $(b).disabled=true; });
    let foto1_path=null;
    if(foto1File) foto1_path = await uploadFoto(foto1File);
    const tanggal=$('jTanggal').value;
    const payload={ guru_id:state.user.id, guru_nama:state.user.nama, tanggal, hari:hariDariTanggal(tanggal), mapel:$('jMapel').value, kelas:$('jKelas').value, jam:$('jJam').value,
     materi:$('jMateri').value, tujuan:$('jTujuan').value, kegiatan:$('jKegiatan').value, catatan:$('jCatatan').value, tindak_lanjut:$('jTindak').value, foto1_path, foto2_path:null, status };
    const {data,error}=await sb.from('jurnal').insert(payload).select().single();
    btns.forEach(b=>{ if($(b)) $(b).disabled=false; });
    if(error) return toast('Gagal menyimpan jurnal: '+error.message,'err');
    DB.jurnal.unshift(data);
    if(status==='Terkirim') logAudit('Kirim Jurnal', $('jMapel').value+' / '+$('jKelas').value);
    toast(status==='Terkirim'? 'Jurnal berhasil dikirim' : 'Draft jurnal disimpan');
    $('jurnalModalBg').remove(); renderContent();
  }
  $('btnSaveDraftJurnal').addEventListener('click', ()=>collectAndSave('Draft', false));
  $('btnKirimJurnal').addEventListener('click', ()=>collectAndSave('Terkirim', true));
}

/* ---------------- INIT ---------------- */
(async function init(){
  if(CONFIG_MISSING){ render(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    const { data:profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(profile){
      state.user = { id: session.user.id, email: session.user.email, nama: profile.nama, role: profile.role, wali_kelas_of: profile.wali_kelas_of };
      await fetchAll();
    }
  }
  render();
})();
</script>
